<script>
// Model the hospital cookie plugin and its native handlers. The plugin reads
// the first matching cookie and writes without an explicit path.
$.cookie = function(name, value) {
  if (value !== undefined) {
    document.cookie = name + '=' + encodeURIComponent(value);
    return;
  }
  var cookies = document.cookie.split(';'), i, item;
  for (i = 0; i < cookies.length; i++) {
    item = $.trim(cookies[i]);
    if (item.indexOf(name + '=') === 0) return decodeURIComponent(item.substring(name.length + 1));
  }
  return null;
};
$('select[name=status]').change(function() { $.cookie('selected_status', this.value); });
$('#QueryButton').click(function() { document.forms['MJB3WForm'].submit(); });
$('#ClearAllButton').click(function() { $('select[name=status]').val(''); });
var saved = $.cookie('selected_status');
if (saved !== null) $('select[name=status]').attr('value', saved);
function runTestCode(code) {
  try { return eval(code); } catch (e) { return 'SCRIPT ERROR: ' + e.message; }
}
</script>
