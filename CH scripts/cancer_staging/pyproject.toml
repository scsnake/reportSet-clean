[project]
name = "cancer-staging"
version = "0.1.0"
description = "Human-in-the-loop cancer-staging workflow for 陳醫師: Sheet → RIS chart search → cancer-tnm → append staging → confirm."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gspread>=6.1",
    "google-auth-oauthlib>=1.2",
    "python-dotenv>=1.0",
    "pydantic>=2",
    "requests>=2.32",
    "rich>=13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "playwright>=1.63.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
